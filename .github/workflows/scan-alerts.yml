name: Scan confirmed option triggers
on:
  schedule:
    # GitHub Actions' shortest interval is 5 minutes; runs may be delayed.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: optiontrigger-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run authorized scanner
        env:
          ENDPOINT: ${{ secrets.OPTIONTRIGGER_SCAN_URL }}
          SECRET: ${{ secrets.OPTIONTRIGGER_SCAN_SECRET }}
        run: |
          test -n "$ENDPOINT" || { echo "Missing OPTIONTRIGGER_SCAN_URL secret"; exit 1; }
          test -n "$SECRET" || { echo "Missing OPTIONTRIGGER_SCAN_SECRET"; exit 1; }
          curl --fail-with-body --silent --show-error --max-time 75 \
            --retry 2 --retry-delay 3 -X POST "$ENDPOINT" \
            -H "Authorization: Bearer $SECRET" \
            -H "Content-Type: application/json"
